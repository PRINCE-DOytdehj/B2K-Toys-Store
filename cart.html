<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2K Toys | Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        <a href="index.html">B2K <span>TOYS</span></a>
    </div>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="categories.html">Categories</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="track-order.html">Track Order</a>

        <a href="cart.html" class="cart-link active">
            Cart <span id="cart-count">0</span>
        </a>
    </nav>

</header>


<main>

    <section class="page-banner">
        <p>YOUR SHOPPING BAG</p>
        <h1>Shopping Cart</h1>
    </section>


    <section class="cart-section">

        <div class="cart-layout">

            <div id="cart-items" class="cart-list">
                <!-- Cart items load here -->
            </div>


            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Total</span>
                    <strong>₹<span id="cart-total">0</span></strong>
                </div>

                <a
                    href="checkout.html"
                    class="checkout-button"
                    style="display:block; text-align:center;">
                    PROCEED TO CHECKOUT
                </a>

                <a
                    href="products.html"
                    class="outline-button"
                    style="display:block; text-align:center; margin-top:12px;">
                    CONTINUE SHOPPING
                </a>

            </div>

        </div>

    </section>

</main>


<footer class="footer">

    <div class="footer-grid">

        <div>
            <h2>B2K TOYS</h2>
            <p>Fun starts here.</p>
        </div>

        <div>
            <h3>Shop</h3>
            <a href="products.html">Products</a>
            <a href="categories.html">Categories</a>
        </div>

        <div>
            <h3>Support</h3>
            <a href="contact.html">Contact</a>
            <a href="track-order.html">Track Order</a>
        </div>

    </div>

    <div class="footer-bottom">
        <p>© 2026 B2K Toys Store. Demo E-Commerce Website.</p>
    </div>

</footer>


<script src="script.js"></script>

</body>
</html>
